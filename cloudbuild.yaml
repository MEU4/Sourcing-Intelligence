steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/github.com/meu4/sourcing-intelligence:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/github.com/meu4/sourcing-intelligence:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'sourcing-intelligence'
      - '--image=gcr.io/$PROJECT_ID/github.com/meu4/sourcing-intelligence:$COMMIT_SHA'
      - '--region=us-central1'
